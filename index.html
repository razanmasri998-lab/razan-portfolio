<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --border: #e5e7eb;
      --focus: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 68px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .nav-links a:hover { opacity: 0.6; }

    a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 12px 16px;
        height: auto;
        min-height: 68px;
        flex-wrap: wrap;
        gap: 8px 16px;
      }
      .nav-links { gap: 20px; }
      .nav-links a { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="#" class="logo" aria-label="Portfolio – Startseite">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="8 6 2 12 8 18"></polyline>
        <polyline points="16 6 22 12 16 18"></polyline>
      </svg>
      Portfolio
    </a>

    <nav aria-label="Hauptnavigation">
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

</body>
</html>
